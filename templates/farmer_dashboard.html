{% extends 'base.html' %}
{% block content %}
<h2>Farmer Dashboard</h2>
<p>Welcome, {{ current_user.username if current_user else 'Guest' }}</p>
<h3>Recent Scans</h3>
<ul>
  {% for s in scans %}
    <li><a href="/export-report/{{ s.id }}">Scan #{{ s.id }} - {{ s.disease }}</a></li>
  {% else %}
    <li>No scans yet.</li>
  {% endfor %}
</ul>
{% endblock %}
