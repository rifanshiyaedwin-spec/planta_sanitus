{% extends 'base.html' %}
{% block content %}
<h2>Account</h2>
<form method="post">
  <label>Full name: <input name="full_name" value="{{ user.full_name if user else '' }}"></label><br>
  <label>Phone: <input name="phone" value="{{ user.phone if user else '' }}"></label><br>
  <label>Email: <input name="email" value="{{ user.email if user else '' }}"></label><br>
  <button type="submit">Save</button>
</form>
{% endblock %}
